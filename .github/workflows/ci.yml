name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes / PR updates don't
# pile up redundant checks or waste runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (stable + aarch64 musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
          components: clippy, rustfmt
      - name: Make rust-lld available for the musl linker
        # rust-lld ships inside the stable toolchain itself; this step only
        # ensures PATH/rustup agree before RUSTFLAGS references it.
        run: rustup component add rust-lld || true
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Format check
        # rustfmt's idea of the right layout moves with the toolchain, and a
        # formatting-only failure used to skip every later step - clippy, the
        # unit tests, the real-kernel netlink pin - hiding real breakage behind
        # a whitespace diff. On main that repair is mechanical and the `autofix`
        # job below does it in one commit, so here it is reported and never
        # allowed to mask the rest; on a pull request it stays a hard gate.
        run: |
          mkdir -p ci-logs
          if cargo fmt --check > ci-logs/fmt.log 2>&1; then
            echo "formatting is clean"
          else
            echo "::warning::cargo fmt --check reported differences; see the ci-logs artifact"
            cat ci-logs/fmt.log
            if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::run cargo fmt and commit the result"
              exit 1
            fi
          fi
      - name: Clippy (all targets, deny warnings)
        run: |
          mkdir -p ci-logs
          cargo clippy --all-targets -- -D warnings 2>&1 | tee ci-logs/clippy.log
          exit "${PIPESTATUS[0]}"
      - name: Unit tests
        run: |
          mkdir -p ci-logs
          cargo test 2>&1 | tee ci-logs/test.log
          exit "${PIPESTATUS[0]}"
      - name: Pin the netlink layout against a real kernel
        # Unit tests assert the bytes we build, not what the kernel does with
        # them: both bugs this module shipped with produced plausible buffers
        # and a silent -EINVAL, and no unit test can see that. This replays the
        # same wire image inside a throwaway network namespace. It exits 0
        # (skipped) where namespaces are unavailable, so it never blocks CI.
        run: python3 tests/netlink_netns.py
      - name: Cross-compile static aarch64 ELF (release)
        # The OpenWrt package ships the prebuilt binary in root/usr/sbin.
        # Linking happens with rust-lld (RUSTFLAGS), so no musl cross C
        # toolchain is needed on the runner.
        run: RUSTFLAGS="-C linker=rust-lld" cargo build --release --target aarch64-unknown-linux-musl
      - name: Assert shipped binaries are static aarch64 executables (100755)
        # A dynamically linked ELF would silently fail on a musl router; a lost
        # exec bit would make procd fail to start the service.  Both are pinned
        # here instead of on-device.
        run: |
          file target/aarch64-unknown-linux-musl/release/h5000m-netmode | grep -q 'statically linked'
          file target/aarch64-unknown-linux-musl/release/h5000m-netmode-status | grep -q 'statically linked'
          file target/aarch64-unknown-linux-musl/release/h5000m-netmode | grep -q 'ARM aarch64'
          test -x root/usr/sbin/h5000m-netmode
          test -x root/usr/sbin/h5000m-netmode-status
          echo "shipped binaries are static aarch64 executables"
      - name: Report drift between src/ and the committed binaries
        # root/usr/sbin/* is a prebuilt artefact that lives in git, so src/ can
        # move without the package binary ever changing.  Nothing in the build
        # catches that: the ipk installs, the service starts, and only the
        # behaviour is old.  Compare byte-for-byte and publish what src/ builds
        # today, so the drift is visible in the run and fixable in one command
        # (scripts/build-rust.sh).
        run: |
          rel="target/aarch64-unknown-linux-musl/release"
          mkdir -p dist-artifacts
          for b in h5000m-netmode h5000m-netmode-status; do
            cp -f "$rel/$b" "dist-artifacts/$b"
            if cmp -s "$rel/$b" "root/usr/sbin/$b"; then
              echo "$b: matches src/"
            else
              echo "::warning::root/usr/sbin/$b is stale - it does not match src/. Run scripts/build-rust.sh and commit the result."
            fi
          done
      - name: Upload the binaries built from src/
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h5000m-netmode-aarch64-musl
          path: dist-artifacts/
      - name: Upload the check logs
        # A failing step's console output is the only place these details exist,
        # and it is not reachable from the API. Keep the fmt / clippy / test
        # output as an artefact so a red run can be diagnosed without a browser.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          if-no-files-found: ignore
      - name: Check shell syntax of the remaining shell backend files
        # The core backend is Rust now; init/hotplug/uci-defaults stay POSIX sh
        # and must keep parsing under dash (CI default /bin/sh).
        run: |
          sh -n root/etc/hotplug.d/iface/95-h5000m-netmode
          sh -n root/etc/uci-defaults/90-h5000m-netmode
          sh -n root/etc/init.d/h5000m-netmode
      - name: Assert shipped scripts are executable
        # An init script without the exec bit is the quietest possible failure:
        # rc.d still links it, procd cannot execve it, the service never starts,
        # and nothing logs an error.  Neither `sh -n` nor cargo sees this, so it
        # needs its own assertion.
        run: |
          bad="$(git ls-files -s | awk '$1 == "100644" { print $4 }' \
                 | grep -E '^(root/(etc/(init\.d|hotplug\.d|uci-defaults|rc\.d)/|usr/(sbin|bin)/)|scripts/|tests/.*\.sh$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::these files are shipped to the device and must be executable:"
            echo "$bad"
            exit 1
          fi
          echo "all shipped scripts are executable"
      - name: Check LuCI JavaScript syntax
        run: node --check htdocs/luci-static/resources/view/h5000m/netmode.js
      - name: Validate JSON metadata
        run: |
          jq empty root/usr/share/luci/menu.d/luci-app-h5000m-netmode.json
          jq empty root/usr/share/rpcd/acl.d/luci-app-h5000m-netmode.json
      - name: Validate translations
        run: msgfmt --check --check-format -o /dev/null po/zh_Hans/h5000m-netmode.po
      - name: Gate the catalogue on what po2lmo does with it
        run: |
          python3 tools/check_catalog.py --self-test
          python3 tools/check_catalog.py
      - name: Keep the translation catalogue in sync with the source
        run: python3 tools/sync_po.py --check
      - name: Audit the animated SVGs and the view/status field contract
        # The backend field oracle is the Rust `status.rs` snapshot emitter now.
        run: node tests/svg_audit.js htdocs/luci-static/resources/view/h5000m/netmode.js src/status.rs
      - name: Test the exit card's branches
        run: node tests/test_exit_card.js htdocs/luci-static/resources/view/h5000m/netmode.js

  # Two artefacts can silently fall behind src/: the committed prebuilt binary
  # (the buildroot has no Rust toolchain) and rustfmt's own output (it moves
  # with the toolchain). Neither is worth a red run - the first ships old
  # behaviour, the second hides every later check behind a whitespace diff - and
  # both are mechanically repairable. On main this job fixes them in one commit;
  # the follow-up push runs CI again, finds nothing to fix, and stops.
  autofix:
    needs: rust-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # rustfmt only: no target, no clippy component, no download of the
      # toolchain twice.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/download-artifact@v4
        with:
          name: h5000m-netmode-aarch64-musl
          path: dist-artifacts
      - name: Reformat src/ and refresh the shipped binaries
        run: |
          cargo fmt
          for b in h5000m-netmode h5000m-netmode-status; do
            if [ ! -f "dist-artifacts/$b" ]; then
              echo "::error::dist-artifacts/$b is missing; cannot refresh the shipped binaries"
              exit 1
            fi
            if ! cmp -s "dist-artifacts/$b" "root/usr/sbin/$b"; then
              install -m 0755 "dist-artifacts/$b" "root/usr/sbin/$b"
              echo "root/usr/sbin/$b updated from src/"
            fi
          done
          if [ -z "$(git status --porcelain -- src root/usr/sbin)" ]; then
            echo "nothing to fix: sources are formatted and the binaries match src/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src root/usr/sbin
          msg="$(printf '%s\n\n%s\n' \
            "chore(autofix): 同步 rustfmt 结果与 src/ 编译产物" \
            "由 CI 自动生成，详见 .github/workflows/ci.yml 的 autofix 任务。")"
          git commit -m "$msg"
          # A repo whose default GITHUB_TOKEN is read-only cannot push. Say so,
          # but every check that matters already ran, so do not fail the run.
          git push origin main || {
            echo "::warning::cannot push the autofix; run cargo fmt and scripts/build-rust.sh locally"
            exit 0
          }
