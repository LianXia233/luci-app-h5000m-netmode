name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes / PR updates don't
# pile up redundant checks or waste runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Check shell syntax
        run: |
          sh -n root/usr/sbin/h5000m-netmode
          sh -n root/usr/sbin/h5000m-netmode-status
          sh -n root/etc/hotplug.d/iface/95-h5000m-netmode
          sh -n root/etc/uci-defaults/90-h5000m-netmode
          sh -n root/etc/init.d/h5000m-netmode
          sh -n tests/run_tests.sh
          for f in tests/mockbin/*; do sh -n "$f"; done
      - name: Check LuCI JavaScript syntax
        run: node --check htdocs/luci-static/resources/view/h5000m/netmode.js
      - name: Validate JSON metadata
        run: |
          jq empty root/usr/share/luci/menu.d/luci-app-h5000m-netmode.json
          jq empty root/usr/share/rpcd/acl.d/luci-app-h5000m-netmode.json
      - name: Validate translations
        run: msgfmt --check --check-format -o /dev/null po/zh_Hans/h5000m-netmode.po
      - name: Keep the translation catalogue in sync with the source
        # The committed catalogue once described an entire earlier revision of the
        # page, so every entry in it was inert: the view's msgids had no catalogue
        # entries at all.  Regenerating fixes the file today; this check is what
        # stops it from rotting again the next time a string is added.
        run: python3 tools/sync_po.py --check
      - name: Audit the animated SVGs and the view/backend field contract
        # The animations live partly in SVG class attributes inside JS string
        # literals, so "the icons render" is not something a syntax check can
        # see; a class with no rule silently renders frozen, and a field the
        # view reads but status does not print becomes undefined in the UI.
        run: node tests/svg_audit.js htdocs/luci-static/resources/view/h5000m/netmode.js root/usr/sbin/h5000m-netmode
      - name: Test the exit card's branches
        # The card has four branches and the device is in exactly one of them, so
        # the other three can only be exercised off-device: provoking them on a
        # router would mean changing the routing policy the test runs over.  The
        # module is loaded with stubs, its source unmodified.
        run: node tests/test_exit_card.js htdocs/luci-static/resources/view/h5000m/netmode.js
      - name: Run backend test suite
        # dash here, BusyBox ash on the router: the suite is deliberately POSIX sh
        # so that the exit-policy decisions that are unsafe to provoke on a live
        # device (policy routing, symbolic device refs, an IPv6 split) are pinned
        # by assertions instead of by manual testing.
        run: sh tests/run_tests.sh root/usr/sbin/h5000m-netmode
